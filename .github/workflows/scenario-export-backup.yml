name: Scenario export and backup

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.sophy/scenarios/**'
      - 'tools/scenarios/export_scenarios.py'
      - 'tools/scenarios/solve_three_body.py'
      - 'tests/test_scenario_exporter.py'
      - 'tests/test_three_body_solution.py'
      - '.github/workflows/scenario-export-backup.yml'
  pull_request:
    paths:
      - '.sophy/scenarios/**'
      - 'tools/scenarios/export_scenarios.py'
      - 'tools/scenarios/solve_three_body.py'
      - 'tests/test_scenario_exporter.py'
      - 'tests/test_three_body_solution.py'
      - '.github/workflows/scenario-export-backup.yml'

permissions:
  contents: read

jobs:
  validate-export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          PyYAML==6.0.2 pytest==8.3.5

      - name: Run scenario regression tests
        run: python -m pytest -q tests/test_scenario_exporter.py tests/test_three_body_solution.py

      - name: Verify three-body constructive proof
        run: python tools/scenarios/solve_three_body.py --output build/three-body-proof

      - name: Validate and export scenarios
        run: |
          python tools/scenarios/export_scenarios.py \
            --source .sophy/scenarios \
            --output build/scenario-export

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scenario-export-${{ github.run_id }}
          path: |
            build/scenario-export/
            build/three-body-proof/
          if-no-files-found: error
          retention-days: 90

  backup:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate-export
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install exporter dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Rebuild validated export
        run: |
          python tools/scenarios/export_scenarios.py \
            --source .sophy/scenarios \
            --output build/scenario-export

      - name: Prepare timestamped repository backup
        run: |
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          target=".sophy/scenario-archives/${stamp}"
          mkdir -p "$target"
          cp -a build/scenario-export/. "$target/"
          printf '%s\n' \
            "source_commit=${GITHUB_SHA}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            "created_utc=${stamp}" \
            > "$target/archive.meta"

      - name: Open or update backup pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: sophy/scenarios/archive
          delete-branch: true
          add-paths: .sophy/scenario-archives/**
          commit-message: "archive validated scenario exports"
          title: "Archive validated scenario exports"
          body: |
            Automated backup of validated scenario exports.

            - Source commit: `${{ github.sha }}`
            - Workflow run: `${{ github.run_id }}`
            - Bundle: source YAML, normalized JSON, Markdown, SHA-256 manifest

            The stable archive branch is updated rather than creating one branch per run.
