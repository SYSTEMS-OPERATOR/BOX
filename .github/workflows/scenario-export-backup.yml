name: Scenario export and backup

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - '.sophy/scenarios/**'
      - 'tools/scenarios/export_scenarios.py'
      - '.github/workflows/scenario-export-backup.yml'
  pull_request:
    paths:
      - '.sophy/scenarios/**'
      - 'tools/scenarios/export_scenarios.py'
      - '.github/workflows/scenario-export-backup.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-export-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exporter dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate and export scenarios
        run: |
          python tools/scenarios/export_scenarios.py \
            --source .sophy/scenarios \
            --output build/scenario-export

      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenario-export-${{ github.run_id }}
          path: build/scenario-export/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare timestamped repository backup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          stamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          target=".sophy/scenario-archives/${stamp}"
          mkdir -p "$target"
          cp -a build/scenario-export/. "$target/"
          printf '%s\n' \
            "source_commit=${GITHUB_SHA}" \
            "workflow_run=${GITHUB_RUN_ID}" \
            "created_utc=${stamp}" \
            > "$target/archive.meta"

      - name: Open backup pull request
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "archive scenario export ${{ github.run_id }}"
          branch: sophy/scenarios/archive-${{ github.run_id }}
          delete-branch: true
          title: "Archive scenario export ${{ github.run_id }}"
          body: |
            Automated immutable backup of validated scenario exports.

            - Source commit: `${{ github.sha }}`
            - Workflow run: `${{ github.run_id }}`
            - Generated formats: normalized JSON, Markdown, SHA-256 manifest

            This pull request preserves the export without writing generated files directly to `main`.
          labels: |
            automation
            scenario-backup
